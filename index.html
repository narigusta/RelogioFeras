<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendAI — Relógio de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f0f5;
    --muted: #7a7a8c;
    --accent: #7c6af7;
    --accent2: #a898ff;
    --green: #3ecf8e;
    --red: #f56565;
    --amber: #f6ad55;
    --silver: #94a3b8;
    --gold: #f6ad55;
    --diamond: #a898ff;
    --ruby: #fc8181;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, rgba(62,207,142,0.07) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 1rem;
  }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
  }

  /* LOGO */
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .logo span { color: var(--accent2); }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  /* INPUTS */
  .field {
    position: relative;
    margin-bottom: 12px;
  }
  .field input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input::placeholder { color: var(--muted); }
  .field input:focus { border-color: var(--accent); }

  /* BUTTONS */
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #6a58e8; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-secondary {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: var(--border2); color: var(--text); }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    padding: 4px 0;
    transition: color 0.2s;
  }
  .btn-ghost:hover { color: var(--text); }

  /* ERROR */
  .error-msg {
    font-size: 12px;
    color: var(--red);
    margin-top: -6px;
    margin-bottom: 8px;
    display: none;
    padding-left: 4px;
  }

  /* DASHBOARD HEADER */
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.25rem;
  }
  .dash-header .name {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .dash-header .date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: capitalize;
  }

  /* NIVEL STEPS */
  .nivel-steps {
    display: flex;
    gap: 5px;
    margin-bottom: 1.25rem;
  }
  .ns {
    flex: 1;
    padding: 5px 0;
    text-align: center;
    font-size: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--surface2);
    letter-spacing: 0.3px;
    transition: all 0.3s;
  }
  .ns.fera.ativo   { background: rgba(148,163,184,0.15); border-color: var(--silver); color: var(--silver); }
  .ns.prata.ativo  { background: rgba(148,163,184,0.15); border-color: #94a3b8; color: #cbd5e1; }
  .ns.ouro.ativo   { background: rgba(246,173,85,0.15);  border-color: var(--gold);   color: var(--gold); }
  .ns.diamante.ativo { background: rgba(168,152,255,0.15); border-color: var(--diamond); color: var(--diamond); }
  .ns.rubi.ativo   { background: rgba(252,129,129,0.15); border-color: var(--ruby);   color: var(--ruby); }

  /* LEVEL ROW */
  .level-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
  }
  .level-badge {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 99px;
    letter-spacing: 0.5px;
    border: 1px solid;
  }
  .badge-fera     { background: rgba(148,163,184,0.1); color: var(--silver); border-color: rgba(148,163,184,0.3); }
  .badge-prata    { background: rgba(148,163,184,0.1); color: #cbd5e1;       border-color: rgba(148,163,184,0.3); }
  .badge-ouro     { background: rgba(246,173,85,0.12); color: var(--gold);   border-color: rgba(246,173,85,0.35); }
  .badge-diamante { background: rgba(168,152,255,0.12); color: var(--diamond); border-color: rgba(168,152,255,0.35); }
  .badge-rubi     { background: rgba(252,129,129,0.12); color: var(--ruby);  border-color: rgba(252,129,129,0.35); }

  .streak-pill {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
  }

  /* XP BAR */
  .xp-wrap { margin-bottom: 1.25rem; }
  .xp-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .xp-track {
    height: 4px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* METRICS */
  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .metric {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .metric-value {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  /* PROGRESS */
  .prog-wrap { margin-bottom: 1rem; }
  .prog-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .prog-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* STATUS */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 1.25rem;
    border: 1px solid;
  }
  .status-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .s-green { background: rgba(62,207,142,0.1); color: var(--green); border-color: rgba(62,207,142,0.25); }
  .s-green::before { background: var(--green); }
  .s-red   { background: rgba(245,101,101,0.1); color: var(--red);   border-color: rgba(245,101,101,0.25); }
  .s-red::before { background: var(--red); }
  .s-amber { background: rgba(246,173,85,0.1);  color: var(--amber); border-color: rgba(246,173,85,0.25); }
  .s-amber::before { background: var(--amber); }

  /* CHECKPOINTS */
  .cp-title {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .checkpoints { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.5rem; }
  .cp {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  .cp.done    { border-color: rgba(62,207,142,0.3); background: rgba(62,207,142,0.05); }
  .cp.current { border-color: rgba(124,106,247,0.4); background: rgba(124,106,247,0.07); }
  .cp.atrasado { border-color: rgba(245,101,101,0.3); background: rgba(245,101,101,0.05); }
  .cp-label   { color: var(--muted); font-size: 12px; }
  .cp.done .cp-label    { color: var(--green); }
  .cp.current .cp-label { color: var(--accent2); }
  .cp.atrasado .cp-label { color: var(--red); }
  .cp-right { display: flex; align-items: center; gap: 8px; }
  .cp-val   { font-weight: 500; color: var(--text); font-size: 13px; }
  .cp-tag   { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; font-family: 'Syne', sans-serif; letter-spacing: 0.3px; }
  .tag-done     { background: rgba(62,207,142,0.15); color: var(--green); }
  .tag-atual    { background: rgba(124,106,247,0.15); color: var(--accent2); }
  .tag-atrasado { background: rgba(245,101,101,0.15); color: var(--red); }
  .tag-hoje     { background: rgba(246,173,85,0.15); color: var(--amber); }

  /* ADD BUTTON */
  .add-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .add-btn:hover { background: #6a58e8; box-shadow: 0 0 30px rgba(124,106,247,0.35); }
  .add-btn:active { transform: scale(0.98); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* DIVIDER */
  hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* LOADING OVERLAY */
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.8);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    backdrop-filter: blur(4px);
  }
  #loading.show { display: flex; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: var(--muted); }

  /* INICIO SCREEN */
  .inicio-inner { text-align: center; padding: 1rem 0; }
  .inicio-icon {
    width: 64px;
    height: 64px;
    background: rgba(124,106,247,0.15);
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 28px;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Carregando...</p></div>
<div id="toast"></div>

<div class="app">

  <!-- INICIO -->
  <div id="s-inicio" class="screen active">
    <div class="card">
      <div class="inicio-inner">
        <div class="inicio-icon">⚡</div>
        <div class="logo">vend<span>ai</span></div>
        <p class="tagline">Seu painel gamificado de metas</p>
        <button class="btn-primary" onclick="go('s-login')">Entrar</button>
        <button class="btn-secondary" onclick="go('s-cadastro')">Criar conta</button>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="s-login" class="screen">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <div>
          <div class="logo" style="font-size:22px">vend<span>ai</span></div>
          <p style="font-size:13px;color:var(--muted);margin-top:2px">Bem-vindo de volta</p>
        </div>
        <button class="btn-ghost" onclick="go('s-inicio')">← Voltar</button>
      </div>
      <div class="field"><input id="l-email" type="email" placeholder="Email"></div>
      <div class="field"><input id="l-senha" type="password" placeholder="Senha"></div>
      <p id="l-err" class="error-msg"></p>
      <button class="btn-primary" onclick="login()">Entrar</button>
    </div>
  </div>

  <!-- CADASTRO -->
  <div id="s-cadastro" class="screen">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <div>
          <div class="logo" style="font-size:22px">vend<span>ai</span></div>
          <p style="font-size:13px;color:var(--muted);margin-top:2px">Crie sua conta</p>
        </div>
        <button class="btn-ghost" onclick="go('s-inicio')">← Voltar</button>
      </div>
      <div class="field"><input id="c-nome" placeholder="Seu nome"></div>
      <div class="field"><input id="c-email" type="email" placeholder="Email"></div>
      <div class="field"><input id="c-senha" type="password" placeholder="Senha"></div>
      <p id="c-err" class="error-msg"></p>
      <button class="btn-primary" onclick="register()">Criar conta</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="s-dash" class="screen">
    <div class="card">

      <div class="dash-header">
        <div>
          <div class="name" id="d-nome">Olá!</div>
          <div class="date" id="d-data"></div>
        </div>
        <button class="btn-ghost" onclick="logout()">Sair →</button>
      </div>

      <div class="nivel-steps" id="nivel-steps"></div>

      <div class="level-row">
        <span class="level-badge badge-fera" id="d-level">Fera</span>
        <span class="streak-pill" id="d-streak">0 vendas hoje</span>
      </div>

      <div class="xp-wrap">
        <div class="xp-labels">
          <span id="d-xp-desc">Progresso para Prata</span>
          <span id="d-xp">0 / 31</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill" id="d-xp-fill" style="width:0%;background:var(--silver)"></div>
        </div>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <div class="metric-label">Meta mensal</div>
          <div class="metric-value" id="d-meta">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Vendas no mês</div>
          <div class="metric-value" id="d-total">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Dias úteis rest.</div>
          <div class="metric-value" id="d-du-rest">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Ritmo necessário</div>
          <div class="metric-value" id="d-ritmo" style="font-size:18px">—</div>
        </div>
      </div>

      <div class="prog-wrap">
        <div class="prog-header">
          <span>Progresso da meta</span>
          <span id="d-pct">0%</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="d-bar" style="width:0%"></div></div>
      </div>

      <div id="d-status" class="status-badge s-amber">Carregando...</div>

      <p class="cp-title">Checkpoints do mês</p>
      <div class="checkpoints" id="d-checkpoints"></div>

      <button class="add-btn" id="add-btn" onclick="addVenda()">+ Registrar venda</button>
      <button class="btn-secondary" onclick="window.open('https://claude.ai','_blank')">Pedir dicas de vendas ↗</button>

    </div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyIL2NlyRaWY664scK9EiQDQiHqp0sVlk5vT-0EI9fiZHiPZhFTp6PMnzIF4l_e5iAF/exec";
let user = null;

const NIVEIS = [
  { nome:'Fera', min:0 },
  { nome:'Prata', min:300 },
  { nome:'Ouro', min:600 },
  { nome:'Diamante', min:1000 },
  { nome:'Rubi', min:1500 },
];

function tempoRestanteDia() {
  const agora = new Date();
  const fim = new Date();
  fim.setHours(18,0,0,0);

  const diff = fim - agora;
  if (diff <= 0) return "Dia encerrado";

  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor((diff / 1000 / 60) % 60);

  return `${h}h ${m}min restantes`;
}

function atualizarStreak() {
  const hoje = new Date().toDateString();
  const last = localStorage.getItem('last_day');

  let streak = parseInt(localStorage.getItem('streak') || '0');

  if (last === hoje) return streak;

  const ontem = new Date();
  ontem.setDate(ontem.getDate() - 1);

  if (last === ontem.toDateString()) {
    streak++;
  } else {
    streak = 1;
  }

  localStorage.setItem('last_day', hoje);
  localStorage.setItem('streak', streak);

  return streak;
}

function getNivel(xp){
  let nivel = NIVEIS[0];
  for (const n of NIVEIS){
    if (xp >= n.min) nivel = n;
  }
  return nivel;
}

function renderDash(vendas) {
  const meta = user.meta;
  const hoje = new Date();

  const streak = parseInt(localStorage.getItem('streak') || '0');
  const xp = vendas * (10 + streak);

  const nivel = getNivel(xp);

  document.getElementById('d-nome').textContent = 'Olá, ' + user.nome.split(' ')[0];
  document.getElementById('d-data').textContent =
    hoje.toLocaleDateString('pt-BR') + ' • ' + tempoRestanteDia();

  document.getElementById('d-meta').textContent = meta;
  document.getElementById('d-total').textContent = vendas;

  const faltam = Math.max(meta - vendas, 0);

  document.getElementById('d-pct').textContent =
    Math.min(Math.round((vendas/meta)*100),100) + '%';

  document.getElementById('d-bar').style.width =
    Math.min((vendas/meta)*100,100) + '%';

  document.getElementById('d-level').textContent = nivel.nome;
  document.getElementById('d-streak').textContent =
    `🔥 ${streak} dias de sequência`;

  // MODO GESTOR
  let msg = '';
  if (vendas >= meta) {
    msg = '🔥 Meta batida! Agora é bônus!';
  } else if (faltam <= 3) {
    msg = '⚠️ Falta pouco. Foco total!';
  } else if (vendas/meta >= 0.7) {
    msg = '🟢 Bom ritmo. Continua.';
  } else {
    msg = '🚨 Abaixo do ritmo. Reage AGORA.';
  }

  document.getElementById('d-status').textContent = msg;
}

async function login() {
  const email = document.getElementById('l-email').value;
  const senha = document.getElementById('l-senha').value;

  const res = await fetch(API, {
    method:'POST',
    body: JSON.stringify({ action:'login', email, senha })
  });

  const data = await res.json();

  if (!data.success) return alert('Erro login');

  user = data.user;

  const r2 = await fetch(API, {
    method:'POST',
    body: JSON.stringify({ action:'getUserData', userId:user.id })
  });

  const d2 = await r2.json();

  renderDash(d2.total);
  go('s-dash');
}

async function addVenda() {
  const btn = document.getElementById('add-btn');

  btn.disabled = true;
  btn.textContent = 'Registrando...';

  await fetch(API, {
    method:'POST',
    body: JSON.stringify({ action:'saveVenda', userId:user.id })
  });

  atualizarStreak();

  const r2 = await fetch(API, {
    method:'POST',
    body: JSON.stringify({ action:'getUserData', userId:user.id })
  });

  const d2 = await r2.json();

  renderDash(d2.total);

  // EFEITO VISUAL
  document.body.style.transform = 'scale(1.02)';
  setTimeout(()=> document.body.style.transform='scale(1)',100);

  toast('🔥 BOA! Venda registrada!');

  btn.disabled = false;
  btn.textContent = '+ Registrar venda';
}

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
