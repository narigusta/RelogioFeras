<!DOCTYPE html>
<html>
<head>
  <title>Relógio de Vendas</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    .tela { display: none; }
    .ativa { display: block; }

    .card {
      background: #fff;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
    }

    input {
      padding: 8px;
      margin: 5px;
      width: 80%;
    }

    /* PROGRESSO */
    .barra {
      width: 100%;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progresso {
      height: 20px;
      background: green;
      width: 0%;
      transition: 0.3s;
    }

    /* LOADING */
    #loading {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      color:#fff;
      align-items:center;
      justify-content:center;
      z-index:9999;
      flex-direction: column;
    }

    .spinner {
      border: 4px solid #fff;
      border-top: 4px solid transparent;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<!-- INICIO -->
<div id="telaInicio" class="tela ativa card">
  <h1>🎯 Relógio de Vendas</h1>
  <button onclick="irPara('telaLogin')">Login</button>
  <button onclick="irPara('telaCadastro')">Cadastrar</button>
</div>

<!-- LOGIN -->
<div id="telaLogin" class="tela card">
  <h2>Login</h2>
  <input id="email" placeholder="Email"><br>
  <input id="senha" type="password" placeholder="Senha"><br>
  <button onclick="login()">Entrar</button>
  <button onclick="irPara('telaInicio')">Voltar</button>
</div>

<!-- CADASTRO -->
<div id="telaCadastro" class="tela card">
  <h2>Cadastro</h2>
  <input id="nomeCadastro" placeholder="Nome"><br>
  <input id="emailCadastro" placeholder="Email"><br>
  <input id="senhaCadastro" placeholder="Senha"><br>
  <button onclick="register()">Cadastrar</button>
  <button onclick="irPara('telaInicio')">Voltar</button>
</div>

<!-- DASHBOARD -->
<div id="telaDashboard" class="tela card">
  <h2 id="nome"></h2>

  <p><b>Meta:</b> <span id="meta"></span></p>
  <p><b>Vendas:</b> <span id="vendas"></span></p>

  <!-- PROGRESSO -->
  <div class="barra">
    <div id="barraProgresso" class="progresso"></div>
  </div>

  <p id="faltam"></p>
  <p id="metaSemana"></p>

  <button onclick="addVenda()">+1 Venda</button>

  <h3 id="status"></h3>

  <button onclick="logout()">Sair</button>
</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>Carregando...</p>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyIL2NlyRaWY664scK9EiQDQiHqp0sVlk5vT-0EI9fiZHiPZhFTp6PMnzIF4l_e5iAF/exec";

let user = null;

// TELAS
function irPara(id){
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
  document.getElementById(id).classList.add("ativa");
}

// LOADING
function showLoading(){ document.getElementById("loading").style.display="flex"; }
function hideLoading(){ document.getElementById("loading").style.display="none"; }

// LIMPAR
function limparDashboard(){
  document.getElementById("nome").innerText="";
  document.getElementById("meta").innerText="";
  document.getElementById("vendas").innerText="";
}

// CADASTRO
async function register(){
  showLoading();
  await fetch(API_URL,{method:"POST",body:JSON.stringify({
    action:"register",
    nome: nomeCadastro.value,
    email: emailCadastro.value,
    senha: senhaCadastro.value
  })});
  hideLoading();
  alert("Cadastrado!");
  irPara("telaLogin");
}

// LOGIN
async function login(){
  showLoading();

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"login",
      email: email.value,
      senha: senha.value
    })
  });

  const data = await res.json();

  if(!data.success){
    hideLoading();
    alert("Login inválido");
    return;
  }

  user = data.user;

  limparDashboard();
  await carregarDados();

  irPara("telaDashboard");
  hideLoading();
}

// LOGOUT
function logout(){
  user=null;
  irPara("telaInicio");
}

// DADOS
async function carregarDados(){
  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"getUserData",
      userId:user.id
    })
  });

  const data = await res.json();

  document.getElementById("nome").innerText = user.nome;
  document.getElementById("meta").innerText = user.meta;
  document.getElementById("vendas").innerText = data.total;

  atualizarGamificacao(data.total, user.meta);
}

// VENDA
async function addVenda(){
  showLoading();

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"saveVenda",
      userId:user.id
    })
  });

  await carregarDados();

  hideLoading();

  alert("🔥 Venda registrada!");
}

// RELÓGIO
function calcularRelogio(meta){
  const hoje = new Date();
  const mes = hoje.getMonth();
  const ano = hoje.getFullYear();

  const sextas=[];
  const ultimoDia = new Date(ano,mes+1,0).getDate();

  for(let d=1; d<=ultimoDia; d++){
    const data = new Date(ano,mes,d);
    if(data.getDay()===5) sextas.push(data);
  }

  const pesos=[0.3,0.6,0.85,1];

  return sextas.map((data,i)=>({
    data,
    valor: Math.round(meta*(pesos[i]||1))
  }));
}

// GAMIFICAÇÃO
function atualizarGamificacao(vendas, meta){
  const faltam = meta - vendas;

  // barra
  const porcentagem = Math.min((vendas/meta)*100,100);
  document.getElementById("barraProgresso").style.width = porcentagem + "%";

  // faltam
  document.getElementById("faltam").innerText =
    faltam > 0 ? `Faltam ${faltam} vendas` : "Meta batida! 🔥";

  // relógio
  const checkpoints = calcularRelogio(meta);
  const hoje = new Date();

  let alvo=0;

  for(let c of checkpoints){
    if(hoje >= c.data){
      alvo = c.valor;
    }
  }

  document.getElementById("metaSemana").innerText =
    `Meta até agora: ${alvo}`;

  // status
  const status = document.getElementById("status");

  if(vendas >= alvo){
    status.innerText = "🟢 No ritmo";
    status.style.color = "green";
  }else{
    status.innerText = "🔴 Atrasado";
    status.style.color = "red";
  }
}
</script>

</body>
</html>
