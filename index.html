
<style>
*{box-sizing:border-box;margin:0;padding:0}
.screen{display:none;flex-direction:column;align-items:center;padding:2rem 1rem;min-height:400px}
.screen.active{display:flex}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.5rem;width:100%;max-width:420px}
.title{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.25rem}
.subtitle{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem}
input{width:100%;padding:10px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:15px;background:var(--color-background-secondary);color:var(--color-text-primary);margin-bottom:10px;outline:none}
input:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 2px rgba(83,74,183,0.12)}
.btn{width:100%;padding:11px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:15px;font-weight:500;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-primary);margin-top:4px;transition:background 0.15s}
.btn:hover{background:var(--color-background-tertiary)}
.btn.primary{background:#534AB7;color:#fff;border-color:#534AB7}
.btn.primary:hover{background:#3C3489}
.btn.ghost{background:transparent;border-color:transparent;color:var(--color-text-secondary);font-size:14px}
.btn.ghost:hover{color:var(--color-text-primary)}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px}
.metric-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.progress-wrap{margin-bottom:1rem}
.progress-header{display:flex;justify-content:space-between;font-size:13px;color:var(--color-text-secondary);margin-bottom:6px}
.track{height:8px;background:var(--color-background-tertiary);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width 0.4s ease}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500;margin-bottom:1rem}
.badge-green{background:#EAF3DE;color:#27500A}
.badge-red{background:#FCEBEB;color:#791F1F}
.badge-amber{background:#FAEEDA;color:#633806}
.checkpoints{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.cp{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);font-size:13px}
.cp.done{border-color:#AFA9EC;background:#EEEDFE}
.cp.current{border-color:#534AB7;background:#EEEDFE}
.cp-label{color:var(--color-text-secondary)}
.cp.done .cp-label,.cp.current .cp-label{color:#3C3489}
.cp-val{font-weight:500}
.cp.done .cp-val,.cp.current .cp-val{color:#3C3489}
.add-btn{width:100%;padding:14px;background:#534AB7;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:16px;font-weight:500;cursor:pointer;transition:background 0.15s;margin-bottom:10px}
.add-btn:hover{background:#3C3489}
.add-btn:active{transform:scale(0.98)}
.xp-bar-wrap{margin-bottom:0.75rem}
.xp-label{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.xp-track{height:5px;background:var(--color-background-tertiary);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;border-radius:99px;transition:width 0.4s ease}
.level-row{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.level-badge{padding:5px 14px;border-radius:99px;font-size:13px;font-weight:500;border:0.5px solid}
.streak{background:var(--color-background-secondary);color:var(--color-text-secondary);padding:5px 12px;border-radius:99px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#26215C;color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:all 0.3s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.logo{font-size:28px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.25rem;letter-spacing:-0.5px}
.logo span{color:#534AB7}
.error{color:#A32D2D;font-size:13px;margin-top:-6px;margin-bottom:8px}

/* Trilha de níveis */
.nivel-trilha{display:flex;align-items:center;gap:0;margin-bottom:1.25rem}
.nt-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.nt-step:not(:last-child)::after{content:'';position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--color-border-tertiary);z-index:0}
.nt-step.passado:not(:last-child)::after{background:#534AB7}
.nt-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--color-border-tertiary);background:var(--color-background-secondary);z-index:1;display:flex;align-items:center;justify-content:center;font-size:10px}
.nt-step.passado .nt-dot{background:#534AB7;border-color:#534AB7;color:#fff}
.nt-step.atual .nt-dot{background:var(--color-background-primary);border-color:#534AB7;border-width:2.5px}
.nt-step.bloqueado .nt-dot{background:var(--color-background-secondary);border-color:var(--color-border-tertiary)}
.nt-label{font-size:10px;color:var(--color-text-secondary);font-weight:500;text-align:center;line-height:1.2}
.nt-step.atual .nt-label{color:var(--color-text-primary);font-weight:600}
.nt-step.passado .nt-label{color:#534AB7}

/* badges coloridos por nível */
.badge-abaixo{background:var(--color-background-secondary);color:var(--color-text-secondary);border-color:var(--color-border-secondary)}
.badge-minimo{background:#FAEEDA;color:#633806;border-color:#FAC775}
.badge-prata{background:#F1EFE8;color:#444441;border-color:#D3D1C7}
.badge-ouro{background:#FAEEDA;color:#412402;border-color:#EF9F27}
.badge-diamante{background:#EEEDFE;color:#26215C;border-color:#AFA9EC}
.badge-rubi{background:#FCEBEB;color:#501313;border-color:#F09595}
</style>

<div id="toast" class="toast"></div>

<div id="s-inicio" class="screen active">
  <div class="card" style="text-align:center">
    <div class="logo">vend<span>ai</span></div>
    <p class="subtitle" style="margin-bottom:1.5rem">Seu painel gamificado de metas</p>
    <button class="btn primary" onclick="go('s-login')">Entrar</button>
    <button class="btn" onclick="go('s-cadastro')" style="margin-top:8px">Criar conta</button>
  </div>
</div>

<div id="s-login" class="screen">
  <div class="card">
    <p class="title">Entrar</p>
    <p class="subtitle">Continue de onde parou</p>
    <input id="l-email" placeholder="Email" type="email">
    <input id="l-senha" placeholder="Senha" type="password">
    <div id="l-err" class="error" style="display:none"></div>
    <button class="btn primary" onclick="login()">Entrar</button>
    <button class="btn ghost" onclick="go('s-inicio')" style="margin-top:8px">Voltar</button>
  </div>
</div>

<div id="s-cadastro" class="screen">
  <div class="card">
    <p class="title">Criar conta</p>
    <p class="subtitle">Comece a acompanhar suas metas</p>
    <input id="c-nome" placeholder="Seu nome">
    <input id="c-email" placeholder="Email" type="email">
    <input id="c-senha" placeholder="Senha" type="password">
    <div id="c-err" class="error" style="display:none"></div>
    <button class="btn primary" onclick="register()">Criar conta</button>
    <button class="btn ghost" onclick="go('s-inicio')" style="margin-top:8px">Voltar</button>
  </div>
</div>

<div id="s-dash" class="screen">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
      <div>
        <p class="title" id="d-nome">Olá!</p>
        <p style="font-size:13px;color:var(--color-text-secondary)" id="d-data"></p>
      </div>
      <button class="btn ghost" onclick="logout()" style="width:auto;padding:6px 12px;margin:0;font-size:13px">Sair</button>
    </div>

    <!-- TRILHA VISUAL -->
    <div class="nivel-trilha" id="nivel-trilha"></div>

    <div class="level-row">
      <span class="level-badge" id="d-level">—</span>
      <span class="streak" id="d-streak">0 vendas hoje</span>
    </div>

    <div class="xp-bar-wrap">
      <div class="xp-label"><span id="d-xp-desc">—</span><span id="d-xp">—</span></div>
      <div class="xp-track"><div class="xp-fill" id="d-xp-fill" style="width:0%"></div></div>
    </div>

    <div class="metric-grid">
      <div class="metric"><div class="metric-label">Meta mensal</div><div class="metric-value" id="d-meta">—</div></div>
      <div class="metric"><div class="metric-label">Vendas no mês</div><div class="metric-value" id="d-total">0</div></div>
      <div class="metric"><div class="metric-label">Dias úteis rest.</div><div class="metric-value" id="d-du-rest">—</div></div>
      <div class="metric"><div class="metric-label">Ritmo necessário</div><div class="metric-value" id="d-ritmo">—</div></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-header"><span>Meta mensal</span><span id="d-pct">0%</span></div>
      <div class="track"><div class="fill" id="d-bar" style="width:0%"></div></div>
    </div>

    <div id="d-status" class="status-badge badge-amber">Carregando...</div>

    <p style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px">Checkpoints do mês</p>
    <div class="checkpoints" id="d-checkpoints"></div>

    <button class="add-btn" id="add-btn" onclick="addVenda()">+ Registrar venda</button>
    <button class="btn ghost" style="font-size:13px" onclick="sendPrompt('Dicas para bater minha meta de vendas este mês')">Pedir dicas de vendas ↗</button>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyIL2NlyRaWY664scK9EiQDQiHqp0sVlk5vT-0EI9fiZHiPZhFTp6PMnzIF4l_e5iAF/exec";
let user=null;

// Estrutura de níveis:
// < 22  → abaixo do mínimo
// 22-30 → bateu o mínimo (sem título de Fera ainda)
// 31+   → Fera Prata
// 41+   → Fera Ouro
// 51+   → Fera Diamante
// 61+   → Fera Rubi
const NIVEIS=[
  {id:'abaixo',  label:'Abaixo do mínimo', min:0,  max:21,  badgeCls:'badge-abaixo',   barCor:'#B4B2A9', xpDesc:'Faltam para o mínimo (22)'},
  {id:'minimo',  label:'Mínimo batido',    min:22, max:30,  badgeCls:'badge-minimo',   barCor:'#EF9F27', xpDesc:'Progresso para Fera Prata (31)'},
  {id:'prata',   label:'Fera Prata',       min:31, max:40,  badgeCls:'badge-prata',    barCor:'#B4B2A9', xpDesc:'Progresso para Fera Ouro (41)'},
  {id:'ouro',    label:'Fera Ouro',        min:41, max:50,  badgeCls:'badge-ouro',     barCor:'#EF9F27', xpDesc:'Progresso para Fera Diamante (51)'},
  {id:'diamante',label:'Fera Diamante',    min:51, max:60,  badgeCls:'badge-diamante', barCor:'#AFA9EC', xpDesc:'Progresso para Fera Rubi (61)'},
  {id:'rubi',    label:'Fera Rubi',        min:61, max:999, badgeCls:'badge-rubi',     barCor:'#F09595', xpDesc:'Nível máximo atingido!'},
];

// Apenas a trilha visual de Feras (sem "abaixo" e "mínimo")
const TRILHA=[
  {label:'Prata', min:31},
  {label:'Ouro',  min:41},
  {label:'Diamante', min:51},
  {label:'Rubi',  min:61},
];

const FERIADOS=['01-01','04-18','04-20','04-21','05-01','06-19','09-07','10-12','11-02','11-15','11-20','12-25'];
function d0(date){return new Date(date.getFullYear(),date.getMonth(),date.getDate());}
function isDiaUtil(date){
  const dow=date.getDay();
  const key=String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
  return dow!==0&&dow!==6&&!FERIADOS.includes(key);
}
function diasUteisMes(ano,mes){
  const dias=[];
  const total=new Date(ano,mes+1,0).getDate();
  for(let d=1;d<=total;d++){const dt=new Date(ano,mes,d);if(isDiaUtil(dt))dias.push(dt);}
  return dias;
}
function getNivelIdx(v){
  for(let i=NIVEIS.length-1;i>=0;i--){if(v>=NIVEIS[i].min)return i;}
  return 0;
}
function calcCheckpoints(meta){
  const hoje=new Date();
  const uteis=diasUteisMes(hoje.getFullYear(),hoje.getMonth());
  const total=uteis.length;
  if(!total)return[];
  return[0.25,0.5,0.75,1].map(p=>{
    const idx=Math.min(Math.round(p*total)-1,total-1);
    return{data:uteis[idx],valor:Math.round(meta*p),pct:Math.round(p*100)};
  });
}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function renderTrilha(vendas){
  const wrap=document.getElementById('nivel-trilha');
  wrap.innerHTML='';
  // Encontra qual passo da trilha está ativo (último atingido)
  let atualIdx=-1;
  TRILHA.forEach((t,i)=>{if(vendas>=t.min)atualIdx=i;});

  TRILHA.forEach((t,i)=>{
    const passado=i<atualIdx;
    const atual=i===atualIdx;
    const bloqueado=i>atualIdx;
    const cls='nt-step '+(passado?'passado':atual?'atual':'bloqueado');
    const dot=passado?'✓':(atual?'★':'');
    wrap.innerHTML+=`<div class="${cls}">
      <div class="nt-dot">${dot}</div>
      <span class="nt-label">${t.label}</span>
    </div>`;
  });
}

function renderDash(vendas){
  const meta=user.meta;
  const hoje=new Date();
  const hojeD0=d0(hoje);
  document.getElementById('d-nome').textContent='Olá, '+user.nome.split(' ')[0]+'!';
  document.getElementById('d-data').textContent=hoje.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('d-meta').textContent=meta;
  document.getElementById('d-total').textContent=vendas;

  const uteis=diasUteisMes(hoje.getFullYear(),hoje.getMonth());
  const duRest=uteis.filter(d=>d0(d)>hojeD0).length;
  const faltam=Math.max(meta-vendas,0);
  document.getElementById('d-du-rest').textContent=duRest;
  document.getElementById('d-ritmo').textContent=duRest>0?(Math.ceil(faltam/duRest)+'/dia'):'—';

  const pct=Math.min(Math.round((vendas/meta)*100),100);
  document.getElementById('d-pct').textContent=pct+'%';

  const idxN=getNivelIdx(vendas);
  const nv=NIVEIS[idxN];
  document.getElementById('d-bar').style.width=pct+'%';
  document.getElementById('d-bar').style.background=nv.barCor;

  // Badge
  const lvBadge=document.getElementById('d-level');
  lvBadge.textContent=nv.label;
  lvBadge.className='level-badge '+nv.badgeCls;

  // Trilha visual (só aparece se >= mínimo)
  document.getElementById('nivel-trilha').style.display=vendas>=22?'flex':'none';
  if(vendas>=22) renderTrilha(vendas);

  // XP bar
  const xpFill=document.getElementById('d-xp-fill');
  const proxIdx=idxN<NIVEIS.length-1?idxN+1:null;
  if(proxIdx!==null){
    const prox=NIVEIS[proxIdx];
    const range=prox.min-nv.min;
    const prog=vendas-nv.min;
    xpFill.style.width=Math.min(Math.round((prog/range)*100),100)+'%';
    xpFill.style.background=prox.barCor;
    document.getElementById('d-xp-desc').textContent=nv.xpDesc;
    document.getElementById('d-xp').textContent=vendas+' / '+prox.min;
  } else {
    xpFill.style.width='100%';
    xpFill.style.background=nv.barCor;
    document.getElementById('d-xp-desc').textContent=nv.xpDesc;
    document.getElementById('d-xp').textContent=vendas+' vendas';
  }

  // Status
  const checkpoints=calcCheckpoints(meta);
  let alvo=0;
  for(const c of checkpoints){if(d0(c.data)<=hojeD0)alvo=c.valor;}
  const st=document.getElementById('d-status');
  if(vendas>=meta){st.textContent='Meta batida!';st.className='status-badge badge-green';}
  else if(vendas>=alvo){st.textContent='No ritmo — faltam '+faltam+' vendas';st.className='status-badge badge-green';}
  else{st.textContent='Atrasado — faltam '+faltam+' vendas';st.className='status-badge badge-red';}

  // Checkpoints
  const cpWrap=document.getElementById('d-checkpoints');
  cpWrap.innerHTML='';
  checkpoints.forEach((c,i)=>{
    const cpD0=d0(c.data);
    const passou=cpD0<=hojeD0;
    const ehHoje=cpD0.getTime()===hojeD0.getTime();
    const anterior=i>0?d0(checkpoints[i-1].data):null;
    const isCurrent=!passou&&(i===0||(anterior&&anterior<=hojeD0));
    const done=passou&&vendas>=c.valor;
    const atrasado=passou&&!done&&!ehHoje;
    let cl='cp';
    if(done)cl='cp done';
    else if(atrasado)cl='cp atrasado';
    else if(isCurrent||ehHoje)cl='cp current';
    const dateStr=c.data.toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
    const extra=ehHoje?' (hoje)':'';
    cpWrap.innerHTML+=`<div class="${cl}">
      <span class="cp-label">${c.pct}% — ${dateStr}${extra}</span>
      <span style="display:flex;align-items:center;gap:6px">
        <span class="cp-val">${c.valor} vendas</span>
        ${done?'<span style="font-size:12px;color:#27500A">✓</span>':''}
        ${atrasado?'<span style="font-size:11px;color:#A32D2D;font-weight:500">atrasado</span>':''}
      </span>
    </div>`;
  });

  const todayKey='vendas_hoje_'+hoje.toDateString();
  const hj=parseInt(localStorage.getItem(todayKey)||'0');
  document.getElementById('d-streak').textContent=hj+(hj===1?' venda hoje':' vendas hoje');
}

async function login(){
  const email=document.getElementById('l-email').value;
  const senha=document.getElementById('l-senha').value;
  const err=document.getElementById('l-err');
  err.style.display='none';
  if(!email||!senha){err.textContent='Preencha todos os campos.';err.style.display='block';return;}
  try{
    const res=await fetch(API,{method:'POST',body:JSON.stringify({action:'login',email,senha})});
    const data=await res.json();
    if(!data.success){err.textContent='Email ou senha inválidos.';err.style.display='block';return;}
    user=data.user;
    const r2=await fetch(API,{method:'POST',body:JSON.stringify({action:'getUserData',userId:user.id})});
    const d2=await r2.json();
    renderDash(d2.total);
    go('s-dash');
  }catch(e){err.textContent='Erro de conexão.';err.style.display='block';}
}

async function register(){
  const nome=document.getElementById('c-nome').value;
  const email=document.getElementById('c-email').value;
  const senha=document.getElementById('c-senha').value;
  const err=document.getElementById('c-err');
  err.style.display='none';
  if(!nome||!email||!senha){err.textContent='Preencha todos os campos.';err.style.display='block';return;}
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'register',nome,email,senha})});
    toast('Conta criada! Faça login.');go('s-login');
  }catch(e){err.textContent='Erro ao criar conta.';err.style.display='block';}
}

async function addVenda(){
  const btn=document.getElementById('add-btn');
  btn.disabled=true;btn.textContent='Registrando...';
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'saveVenda',userId:user.id})});
    const r2=await fetch(API,{method:'POST',body:JSON.stringify({action:'getUserData',userId:user.id})});
    const d2=await r2.json();
    const key='vendas_hoje_'+new Date().toDateString();
    localStorage.setItem(key,String(parseInt(localStorage.getItem(key)||'0')+1));
    renderDash(d2.total);
    toast('Venda registrada!');
  }catch(e){toast('Erro ao registrar.');}
  btn.disabled=false;btn.textContent='+ Registrar venda';
}

function logout(){user=null;go('s-inicio');}
</script>
