<!DOCTYPE html>
<html>
<head>
  <title>Relógio de Vendas</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    .tela { display: none; }
    .ativa { display: block; }

    button {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin: 5px;
    }

    /* LOADING */
    #loading {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      color:#fff;
      align-items:center;
      justify-content:center;
      z-index:9999;
      flex-direction: column;
    }

    .spinner {
      border: 4px solid #fff;
      border-top: 4px solid transparent;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<!-- 🟢 INICIO -->
<div id="telaInicio" class="tela ativa">
  <h1>Acompanhe seu relógio</h1>

  <button onclick="irPara('telaLogin')">Fazer Login</button><br>
  <button onclick="irPara('telaCadastro')">Cadastrar</button>
</div>

<!-- 🔐 LOGIN -->
<div id="telaLogin" class="tela">
  <h2>Login</h2>

  <input id="email" placeholder="Email"><br>
  <input id="senha" type="password" placeholder="Senha"><br>

  <button onclick="login()">Entrar</button><br>
  <button onclick="irPara('telaInicio')">Voltar</button>
</div>

<!-- 📝 CADASTRO -->
<div id="telaCadastro" class="tela">
  <h2>Cadastro</h2>

  <input id="nomeCadastro" placeholder="Nome"><br>
  <input id="emailCadastro" placeholder="Email"><br>
  <input id="senhaCadastro" placeholder="Senha"><br>

  <button onclick="register()">Cadastrar</button><br>
  <button onclick="irPara('telaInicio')">Voltar</button>
</div>

<!-- 📊 DASHBOARD -->
<div id="telaDashboard" class="tela">
  <h2 id="nome"></h2>

  <p>Meta: <span id="meta"></span></p>
  <p>Vendas: <span id="vendas"></span></p>

  <button onclick="addVenda()">+1 Venda</button>

  <h3 id="status"></h3>

  <br>
  <button onclick="logout()">Sair</button>
</div>

<!-- ⏳ LOADER -->
<div id="loading">
  <div class="spinner"></div>
  <p>Carregando...</p>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyIL2NlyRaWY664scK9EiQDQiHqp0sVlk5vT-0EI9fiZHiPZhFTp6PMnzIF4l_e5iAF/exec";

let user = null;

// 🔄 TROCAR TELA
function irPara(telaId) {
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
  document.getElementById(telaId).classList.add("ativa");
}

// ⏳ LOADER
function showLoading() {
  document.getElementById("loading").style.display = "flex";
}
function hideLoading() {
  document.getElementById("loading").style.display = "none";
}

// 🧹 LIMPAR DASHBOARD
function limparDashboard() {
  document.getElementById("nome").innerText = "";
  document.getElementById("meta").innerText = "";
  document.getElementById("vendas").innerText = "";
  document.getElementById("status").innerText = "";
}

// 📝 CADASTRO
async function register() {
  showLoading();

  const nome = document.getElementById("nomeCadastro").value;
  const email = document.getElementById("emailCadastro").value;
  const senha = document.getElementById("senhaCadastro").value;

  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "register",
        nome, email, senha
      })
    });

    alert("Cadastrado com sucesso!");
    irPara("telaLogin");

  } catch {
    alert("Erro ao cadastrar");
  }

  hideLoading();
}

// 🔐 LOGIN (CORRIGIDO)
async function login() {
  showLoading();

  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "login",
        email, senha
      })
    });

    const data = await res.json();

    if (!data.success) {
      hideLoading();
      alert("Login inválido");
      return;
    }

    user = data.user;

    // 🔥 limpa antes
    limparDashboard();

    // 🔥 carrega dados antes de trocar tela
    await carregarDados();

    // 👉 só agora troca
    irPara("telaDashboard");

  } catch {
    alert("Erro de conexão");
  }

  hideLoading();
}

// 🚪 LOGOUT
function logout() {
  user = null;
  irPara("telaInicio");
}

// 📊 CARREGAR DADOS
async function carregarDados() {
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "getUserData",
      userId: user.id
    })
  });

  const data = await res.json();

  document.getElementById("nome").innerText = user.nome;
  document.getElementById("meta").innerText = user.meta;
  document.getElementById("vendas").innerText = data.total;

  atualizarStatus(data.total, user.meta);
}

// ➕ ADD VENDA
async function addVenda() {
  showLoading();

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "saveVenda",
      userId: user.id
    })
  });

  await carregarDados();

  hideLoading();
}

// 🧠 RELÓGIO AUTOMÁTICO
function calcularRelogio(meta) {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();

  const sextas = [];
  const ultimoDia = new Date(ano, mes + 1, 0).getDate();

  for (let d = 1; d <= ultimoDia; d++) {
    const data = new Date(ano, mes, d);
    if (data.getDay() === 5) {
      sextas.push(data);
    }
  }

  const pesos = [0.3, 0.6, 0.85, 1];

  return sextas.map((data, i) => ({
    data,
    valor: Math.round(meta * (pesos[i] || 1))
  }));
}

// 🚦 STATUS
function atualizarStatus(vendas, meta) {
  const hoje = new Date();
  const checkpoints = calcularRelogio(meta);

  let alvo = 0;

  for (let c of checkpoints) {
    if (hoje >= c.data) {
      alvo = c.valor;
    }
  }

  const status = document.getElementById("status");

  if (vendas >= alvo) {
    status.innerText = "🟢 No relógio";
    status.style.color = "green";
  } else {
    status.innerText = "🔴 Fora do relógio";
    status.style.color = "red";
  }
}
</script>

</body>
</html>
