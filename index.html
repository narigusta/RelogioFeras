<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{font-family:Arial;text-align:center;padding:30px}
button{padding:10px 20px;margin:10px}
</style>
</head>
<body>

<h2>Relógio dos Feras</h2>

<div id="inicio">
  <button onclick="primeiraVez()">Primeira vez</button>
  <button onclick="jaTenho()">Já tenho cadastro</button>
</div>

<div id="cadastro" style="display:none">
  <h3>Cadastro</h3>
  <input id="email1" placeholder="Email"><br>
  <select id="meta">
    <option value="22">22</option>
    <option value="31">31</option>
    <option value="41">41</option>
  </select><br>
  <button onclick="cadastrar()">Cadastrar</button>
</div>

<div id="login" style="display:none">
  <h3>Entrar</h3>
  <input id="email2" placeholder="Email"><br>
  <button onclick="entrar()">Entrar</button>
</div>

<div id="painel" style="display:none">
  <h3 id="info"></h3>
  <input id="add" type="number" placeholder="+ vendas">
  <button onclick="salvar()">Salvar</button>
</div>

<script>
let emailGlobal = "";
let vendasAtual = 0;
let metaAtual = 0;

function primeiraVez(){
  document.getElementById("inicio").style.display="none";
  document.getElementById("cadastro").style.display="block";
}

function jaTenho(){
  document.getElementById("inicio").style.display="none";
  document.getElementById("login").style.display="block";
}

function cadastrar(){
  const email = document.getElementById("email1").value;
  const meta = document.getElementById("meta").value;

  google.script.run.criarUsuario(email, meta, function(res){
    emailGlobal = email;
    vendasAtual = 0;
    metaAtual = meta;
    mostrarPainel();
  });
}

function entrar(){
  const email = document.getElementById("email2").value;

  google.script.run.buscarUsuario(email, function(res){
    if(!res){
      alert("Email não encontrado");
      return;
    }

    emailGlobal = email;
    vendasAtual = res.vendas;
    metaAtual = res.meta;

    mostrarPainel();
  });
}

function salvar(){
  const add = Number(document.getElementById("add").value);

  google.script.run.addVenda(emailGlobal, add, function(novo){
    vendasAtual = novo;
    atualizar();
  });
}

function mostrarPainel(){
  document.getElementById("cadastro").style.display="none";
  document.getElementById("login").style.display="none";
  document.getElementById("painel").style.display="block";
  atualizar();
}

function atualizar(){
  document.getElementById("info").innerText =
    vendasAtual + "/" + metaAtual;
}
</script>

</body>
</html>
