<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f0f5;
    --muted: #7a7a8c;
    --accent: #7c6af7;
    --accent2: #a898ff;
    --green: #3ecf8e;
    --red: #f56565;
    --amber: #f6ad55;
    --silver: #94a3b8;
    --gold: #f6ad55;
    --diamond: #a898ff;
    --ruby: #fc8181;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, rgba(62,207,142,0.07) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 1rem;
  }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
  }

  /* LOGO */
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .logo span { color: var(--accent2); }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  /* INPUTS */
  .field {
    position: relative;
    margin-bottom: 12px;
  }
  .field input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input::placeholder { color: var(--muted); }
  .field input:focus { border-color: var(--accent); }

  /* BUTTONS */
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #6a58e8; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-secondary {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-secondary:hover { border-color: var(--border2); color: var(--text); }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    padding: 4px 0;
    transition: color 0.2s;
  }
  .btn-ghost:hover { color: var(--text); }

  /* ERROR */
  .error-msg {
    font-size: 12px;
    color: var(--red);
    margin-top: -6px;
    margin-bottom: 8px;
    display: none;
    padding-left: 4px;
  }

  /* DASHBOARD HEADER */
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.25rem;
  }
  .dash-header .name {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .dash-header .date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: capitalize;
  }

  /* NIVEL STEPS */
  .nivel-steps {
    display: flex;
    gap: 5px;
    margin-bottom: 1.25rem;
  }
  .ns {
    flex: 1;
    padding: 5px 0;
    text-align: center;
    font-size: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--surface2);
    letter-spacing: 0.3px;
    transition: all 0.3s;
  }
  .ns.fera.ativo   { background: rgba(148,163,184,0.15); border-color: var(--silver); color: var(--silver); }
  .ns.prata.ativo  { background: rgba(148,163,184,0.15); border-color: #94a3b8; color: #cbd5e1; }
  .ns.ouro.ativo   { background: rgba(246,173,85,0.15);  border-color: var(--gold);   color: var(--gold); }
  .ns.diamante.ativo { background: rgba(168,152,255,0.15); border-color: var(--diamond); color: var(--diamond); }
  .ns.rubi.ativo   { background: rgba(252,129,129,0.15); border-color: var(--ruby);   color: var(--ruby); }

  /* LEVEL ROW */
  .level-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
  }
  .level-badge {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 99px;
    letter-spacing: 0.5px;
    border: 1px solid;
  }
  .badge-fera     { background: rgba(148,163,184,0.1); color: var(--silver); border-color: rgba(148,163,184,0.3); }
  .badge-prata    { background: rgba(148,163,184,0.1); color: #cbd5e1;       border-color: rgba(148,163,184,0.3); }
  .badge-ouro     { background: rgba(246,173,85,0.12); color: var(--gold);   border-color: rgba(246,173,85,0.35); }
  .badge-diamante { background: rgba(168,152,255,0.12); color: var(--diamond); border-color: rgba(168,152,255,0.35); }
  .badge-rubi     { background: rgba(252,129,129,0.12); color: var(--ruby);  border-color: rgba(252,129,129,0.35); }

  .streak-pill {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
  }

  /* XP BAR */
  .xp-wrap { margin-bottom: 1.25rem; }
  .xp-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .xp-track {
    height: 4px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* METRICS */
  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .metric {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .metric-value {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  /* PROGRESS */
  .prog-wrap { margin-bottom: 1rem; }
  .prog-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .prog-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* STATUS */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 1.25rem;
    border: 1px solid;
  }
  .status-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .s-green { background: rgba(62,207,142,0.1); color: var(--green); border-color: rgba(62,207,142,0.25); }
  .s-green::before { background: var(--green); }
  .s-red   { background: rgba(245,101,101,0.1); color: var(--red);   border-color: rgba(245,101,101,0.25); }
  .s-red::before { background: var(--red); }
  .s-amber { background: rgba(246,173,85,0.1);  color: var(--amber); border-color: rgba(246,173,85,0.25); }
  .s-amber::before { background: var(--amber); }

  /* CHECKPOINTS */
  .cp-title {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .checkpoints { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.5rem; }
  .cp {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  .cp.done    { border-color: rgba(62,207,142,0.3); background: rgba(62,207,142,0.05); }
  .cp.current { border-color: rgba(124,106,247,0.4); background: rgba(124,106,247,0.07); }
  .cp.atrasado { border-color: rgba(245,101,101,0.3); background: rgba(245,101,101,0.05); }
  .cp-label   { color: var(--muted); font-size: 12px; }
  .cp.done .cp-label    { color: var(--green); }
  .cp.current .cp-label { color: var(--accent2); }
  .cp.atrasado .cp-label { color: var(--red); }
  .cp-right { display: flex; align-items: center; gap: 8px; }
  .cp-val   { font-weight: 500; color: var(--text); font-size: 13px; }
  .cp-tag   { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; font-family: 'Syne', sans-serif; letter-spacing: 0.3px; }
  .tag-done     { background: rgba(62,207,142,0.15); color: var(--green); }
  .tag-atual    { background: rgba(124,106,247,0.15); color: var(--accent2); }
  .tag-atrasado { background: rgba(245,101,101,0.15); color: var(--red); }
  .tag-hoje     { background: rgba(246,173,85,0.15); color: var(--amber); }

  /* ADD BUTTON */
  .add-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .add-btn:hover { background: #6a58e8; box-shadow: 0 0 30px rgba(124,106,247,0.35); }
  .add-btn:active { transform: scale(0.98); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* DIVIDER */
  hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* LOADING OVERLAY */
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.8);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    backdrop-filter: blur(4px);
  }
  #loading.show { display: flex; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: var(--muted); }

  /* INICIO SCREEN */
  .inicio-inner { text-align: center; padding: 1rem 0; }
  .inicio-icon {
    width: 64px;
    height: 64px;
    background: rgba(124,106,247,0.15);
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 28px;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Carregando...</p></div>
<div id="toast"></div>

<div class="app">

  <!-- INICIO -->
  <div id="s-inicio" class="screen active">
    <div class="card">
      <div class="inicio-inner">
        <div class="inicio-icon">⚡</div>
        <div class="logo">sua<span>meta</span></div>
        <p class="tagline">Acompanhe o seu progresso!</p>
        <button class="btn-primary" onclick="go('s-login')">Entrar</button>
        <button class="btn-secondary" onclick="go('s-cadastro')">Criar conta</button>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="s-login" class="screen">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <div>
          <div class="logo" style="font-size:22px">sua<span>meta</span></div>
          <p style="font-size:13px;color:var(--muted);margin-top:2px">Bem-vindo de volta</p>
        </div>
        <button class="btn-ghost" onclick="go('s-inicio')">← Voltar</button>
      </div>
      <div class="field"><input id="l-email" type="email" placeholder="Email"></div>
      <div class="field"><input id="l-senha" type="password" placeholder="Senha"></div>
      <p id="l-err" class="error-msg"></p>
      <button class="btn-primary" onclick="login()">Entrar</button>
    </div>
  </div>

  <!-- CADASTRO -->
  <div id="s-cadastro" class="screen">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <div>
          <div class="logo" style="font-size:22px">sua<span>meta</span></div>
          <p style="font-size:13px;color:var(--muted);margin-top:2px">Crie sua conta</p>
        </div>
        <button class="btn-ghost" onclick="go('s-inicio')">← Voltar</button>
      </div>
      <div class="field"><input id="c-nome" placeholder="Seu nome"></div>
      <div class="field"><input id="c-email" type="email" placeholder="Email"></div>
      <div class="field"><input id="c-senha" type="password" placeholder="Senha"></div>
      <p id="c-err" class="error-msg"></p>
      <button class="btn-primary" onclick="register()">Criar conta</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="s-dash" class="screen">
    <div class="card">

      <div class="dash-header">
        <div>
          <div class="name" id="d-nome">Olá!</div>
          <div class="date" id="d-data"></div>
        </div>
        <button class="btn-ghost" onclick="logout()">Sair →</button>
      </div>

      <div class="nivel-steps" id="nivel-steps"></div>

      <div class="level-row">
        <span class="level-badge badge-fera" id="d-level">Fera</span>
        <span class="streak-pill" id="d-streak">0 vendas hoje</span>
      </div>

      <div class="xp-wrap">
        <div class="xp-labels">
          <span id="d-xp-desc">Progresso para Prata</span>
          <span id="d-xp">0 / 31</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill" id="d-xp-fill" style="width:0%;background:var(--silver)"></div>
        </div>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <div class="metric-label">Meta mensal</div>
          <div class="metric-value" id="d-meta">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Vendas no mês</div>
          <div class="metric-value" id="d-total">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Dias úteis rest.</div>
          <div class="metric-value" id="d-du-rest">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Ritmo necessário</div>
          <div class="metric-value" id="d-ritmo" style="font-size:18px">—</div>
        </div>
      </div>

      <div class="prog-wrap">
        <div class="prog-header">
          <span>Progresso da meta</span>
          <span id="d-pct">0%</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="d-bar" style="width:0%"></div></div>
      </div>

      <div id="d-status" class="status-badge s-amber">Carregando...</div>

      <p class="cp-title">Checkpoints do mês</p>
      <div class="checkpoints" id="d-checkpoints"></div>

      <button class="add-btn" id="add-btn" onclick="addVenda()">+ Registrar venda</button>
      <button class="btn-secondary" onclick="window.open('https://claude.ai','_blank')">Pedir dicas de vendas ↗</button>

    </div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyIL2NlyRaWY664scK9EiQDQiHqp0sVlk5vT-0EI9fiZHiPZhFTp6PMnzIF4l_e5iAF/exec";
let user = null;

const NIVEIS = [
  { nome:'Fera',     cls:'fera',     min:0,  max:30,  barCor:'#94a3b8', badgeCls:'badge-fera' },
  { nome:'Prata',    cls:'prata',    min:31, max:40,  barCor:'#cbd5e1', badgeCls:'badge-prata' },
  { nome:'Ouro',     cls:'ouro',     min:41, max:50,  barCor:'#f6ad55', badgeCls:'badge-ouro' },
  { nome:'Diamante', cls:'diamante', min:51, max:60,  barCor:'#a898ff', badgeCls:'badge-diamante' },
  { nome:'Rubi',     cls:'rubi',     min:61, max:999, barCor:'#fc8181', badgeCls:'badge-rubi' },
];

const FERIADOS = ['01-01','04-18','04-20','04-21','05-01','06-19','09-07','10-12','11-02','11-15','11-20','12-25'];

function d0(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }

function isDiaUtil(date) {
  const dow = date.getDay();
  const key = String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
  return dow !== 0 && dow !== 6 && !FERIADOS.includes(key);
}

function diasUteisMes(ano, mes) {
  const dias = [];
  const total = new Date(ano, mes+1, 0).getDate();
  for (let d = 1; d <= total; d++) {
    const dt = new Date(ano, mes, d);
    if (isDiaUtil(dt)) dias.push(dt);
  }
  return dias;
}

function getNivelIdx(v) {
  for (let i = NIVEIS.length-1; i >= 0; i--) { if (v >= NIVEIS[i].min) return i; }
  return 0;
}

function calcCheckpoints(meta) {
  const hoje = new Date();
  const uteis = diasUteisMes(hoje.getFullYear(), hoje.getMonth());
  const total = uteis.length;
  if (!total) return [];
  return [0.25, 0.5, 0.75, 1].map(p => {
    const idx = Math.min(Math.round(p * total) - 1, total - 1);
    return { data: uteis[idx], valor: Math.round(meta * p), pct: Math.round(p * 100) };
  });
}

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLoading()  { document.getElementById('loading').classList.add('show'); }
function hideLoading()  { document.getElementById('loading').classList.remove('show'); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function renderNivelSteps(idxAtual) {
  const wrap = document.getElementById('nivel-steps');
  wrap.innerHTML = '';
  NIVEIS.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'ns ' + n.cls + (i === idxAtual ? ' ativo' : '');
    el.textContent = n.nome;
    wrap.appendChild(el);
  });
}

function renderDash(vendas) {
  const meta = user.meta;
  const hoje = new Date();
  const hojeD0 = d0(hoje);

  document.getElementById('d-nome').textContent = 'Olá, ' + user.nome.split(' ')[0] + '!';
  document.getElementById('d-data').textContent = hoje.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('d-meta').textContent = meta;
  document.getElementById('d-total').textContent = vendas;

  const uteis = diasUteisMes(hoje.getFullYear(), hoje.getMonth());
  const duRest = uteis.filter(d => d0(d) > hojeD0).length;
  const faltam = Math.max(meta - vendas, 0);
  document.getElementById('d-du-rest').textContent = duRest;
  document.getElementById('d-ritmo').textContent = duRest > 0 ? (Math.ceil(faltam / duRest) + '/dia') : '—';

  const pct = Math.min(Math.round((vendas / meta) * 100), 100);
  document.getElementById('d-pct').textContent = pct + '%';
  const idxN = getNivelIdx(vendas);
  const nv = NIVEIS[idxN];
  document.getElementById('d-bar').style.width = pct + '%';
  document.getElementById('d-bar').style.background = nv.barCor;

  const lvBadge = document.getElementById('d-level');
  lvBadge.textContent = nv.nome;
  lvBadge.className = 'level-badge ' + nv.badgeCls;
  renderNivelSteps(idxN);

  const proxIdx = idxN < NIVEIS.length - 1 ? idxN + 1 : null;
  const xpFill = document.getElementById('d-xp-fill');
  if (proxIdx !== null) {
    const prox = NIVEIS[proxIdx];
    const range = prox.min - nv.min;
    const prog = vendas - nv.min;
    xpFill.style.width = Math.min(Math.round((prog / range) * 100), 100) + '%';
    xpFill.style.background = prox.barCor;
    document.getElementById('d-xp-desc').textContent = 'Progresso para ' + prox.nome;
    document.getElementById('d-xp').textContent = vendas + ' / ' + prox.min;
  } else {
    xpFill.style.width = '100%';
    xpFill.style.background = nv.barCor;
    document.getElementById('d-xp-desc').textContent = 'Nível máximo atingido!';
    document.getElementById('d-xp').textContent = vendas + ' vendas';
  }

  const checkpoints = calcCheckpoints(meta);
  let alvo = 0;
  for (const c of checkpoints) { if (d0(c.data) <= hojeD0) alvo = c.valor; }

  const st = document.getElementById('d-status');
  if (vendas >= meta) {
    st.textContent = 'Meta batida!'; st.className = 'status-badge s-green';
  } else if (vendas >= alvo) {
    st.textContent = 'No ritmo — faltam ' + faltam + ' vendas'; st.className = 'status-badge s-green';
  } else {
    st.textContent = 'Atrasado — faltam ' + faltam + ' vendas'; st.className = 'status-badge s-red';
  }

  const cpWrap = document.getElementById('d-checkpoints');
  cpWrap.innerHTML = '';
  checkpoints.forEach((c, i) => {
    const cpD0 = d0(c.data);
    const passou = cpD0 <= hojeD0;
    const ehHoje = cpD0.getTime() === hojeD0.getTime();
    const anterior = i > 0 ? d0(checkpoints[i-1].data) : null;
    const isCurrent = !passou && (i === 0 || (anterior && anterior <= hojeD0));
    const done = passou && vendas >= c.valor;
    const atrasado = passou && !done && !ehHoje;

    let cl = 'cp';
    if (done) cl = 'cp done';
    else if (atrasado) cl = 'cp atrasado';
    else if (isCurrent || ehHoje) cl = 'cp current';

    const dateStr = c.data.toLocaleDateString('pt-BR', { day:'numeric', month:'short' });
    let tag = '';
    if (done) tag = '<span class="cp-tag tag-done">✓ feito</span>';
    else if (ehHoje) tag = '<span class="cp-tag tag-hoje">hoje</span>';
    else if (isCurrent) tag = '<span class="cp-tag tag-atual">atual</span>';
    else if (atrasado) tag = '<span class="cp-tag tag-atrasado">atrasado</span>';

    cpWrap.innerHTML += `<div class="${cl}">
      <span class="cp-label">${c.pct}% — ${dateStr}</span>
      <div class="cp-right"><span class="cp-val">${c.valor} vendas</span>${tag}</div>
    </div>`;
  });

  const todayKey = 'vendas_hoje_' + hoje.toDateString();
  const hj = parseInt(localStorage.getItem(todayKey) || '0');
  document.getElementById('d-streak').textContent = hj + (hj === 1 ? ' venda hoje' : ' vendas hoje');
}

async function login() {
  const email = document.getElementById('l-email').value;
  const senha = document.getElementById('l-senha').value;
  const err = document.getElementById('l-err');
  err.style.display = 'none';
  if (!email || !senha) { err.textContent = 'Preencha todos os campos.'; err.style.display = 'block'; return; }
  showLoading();
  try {
    const res = await fetch(API, { method:'POST', body: JSON.stringify({ action:'login', email, senha }) });
    const data = await res.json();
    if (!data.success) { hideLoading(); err.textContent = 'Email ou senha inválidos.'; err.style.display = 'block'; return; }
    user = data.user;
    const r2 = await fetch(API, { method:'POST', body: JSON.stringify({ action:'getUserData', userId: user.id }) });
    const d2 = await r2.json();
    renderDash(d2.total);
    go('s-dash');
  } catch(e) { err.textContent = 'Erro de conexão.'; err.style.display = 'block'; }
  hideLoading();
}

async function register() {
  const nome = document.getElementById('c-nome').value;
  const email = document.getElementById('c-email').value;
  const senha = document.getElementById('c-senha').value;
  const err = document.getElementById('c-err');
  err.style.display = 'none';
  if (!nome || !email || !senha) { err.textContent = 'Preencha todos os campos.'; err.style.display = 'block'; return; }
  showLoading();
  try {
    await fetch(API, { method:'POST', body: JSON.stringify({ action:'register', nome, email, senha }) });
    toast('Conta criada! Faça login.');
    go('s-login');
  } catch(e) { err.textContent = 'Erro ao criar conta.'; err.style.display = 'block'; }
  hideLoading();
}

async function addVenda() {
  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = 'Registrando...';
  try {
    await fetch(API, { method:'POST', body: JSON.stringify({ action:'saveVenda', userId: user.id }) });
    const r2 = await fetch(API, { method:'POST', body: JSON.stringify({ action:'getUserData', userId: user.id }) });
    const d2 = await r2.json();
    const key = 'vendas_hoje_' + new Date().toDateString();
    localStorage.setItem(key, String(parseInt(localStorage.getItem(key) || '0') + 1));
    renderDash(d2.total);
    toast('Venda registrada!');
  } catch(e) { toast('Erro ao registrar.'); }
  btn.disabled = false; btn.textContent = '+ Registrar venda';
}

function logout() { user = null; go('s-inicio'); }
</script>
