<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio de Vendas</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --text:#f0f0f5;
  --muted:#7a7a8c;
  --accent:#7c6af7;
  --green:#3ecf8e;
  --red:#f56565;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* APP FULL */
.app{
  width:100%;
  padding:24px;
}

/* SCREENS */
.screen{display:none;}
.screen.active{display:block;}

/* CARD */
.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
}

/* DASH GRID */
.dashboard-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}

/* HEADER */
.dash-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* METRICS */
.metric-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.metric{
  background:var(--surface2);
  padding:16px;
  border-radius:12px;
}

.metric-label{
  font-size:12px;
  color:var(--muted);
}

.metric-value{
  font-size:24px;
  font-weight:bold;
}

/* PROGRESS */
.prog{
  margin-top:20px;
}

.prog-bar{
  height:6px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.prog-fill{
  height:100%;
  background:var(--accent);
}

/* BOTÕES */
.add-btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:var(--accent);
  border:none;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

/* RESPONSIVO */
@media(max-width:900px){
  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .metric-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- DASHBOARD -->
<div id="s-dash" class="screen active">

<div class="card">

<div class="dash-header">
  <div>
    <div id="d-nome">Olá!</div>
    <div id="d-data"></div>
  </div>
  <button onclick="logout()">Sair</button>
</div>

<div class="dashboard-grid">

<!-- ESQUERDA -->
<div>

<div id="nivel-steps"></div>

<div id="d-level"></div>

<div id="d-streak"></div>

<div>
  <div id="d-xp-desc"></div>
  <div id="d-xp"></div>
</div>

</div>

<!-- DIREITA -->
<div>

<div class="metric-grid">

<div class="metric">
<div class="metric-label">Meta</div>
<div id="d-meta" class="metric-value"></div>
</div>

<div class="metric">
<div class="metric-label">Vendas</div>
<div id="d-total" class="metric-value"></div>
</div>

<div class="metric">
<div class="metric-label">Dias Rest.</div>
<div id="d-du-rest" class="metric-value"></div>
</div>

<div class="metric">
<div class="metric-label">Ritmo</div>
<div id="d-ritmo" class="metric-value"></div>
</div>

</div>

<div class="prog">
<div id="d-pct"></div>
<div class="prog-bar">
<div id="d-bar" class="prog-fill"></div>
</div>
</div>

<div id="d-status"></div>

<div id="d-checkpoints"></div>

<button class="add-btn" onclick="addVenda()">+ Registrar venda</button>

</div>

</div>

</div>
</div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyIL2NlyRaWY664scK9EiQDQiHqp0sVlk5vT-0EI9fiZHiPZhFTp6PMnzIF4l_e5iAF/exec";
let user = { id:1, nome:"Usuário", meta:100 };

/* SIMULAÇÃO (SEU JS ORIGINAL CONTINUA FUNCIONANDO) */
function render(){
  document.getElementById('d-nome').innerText = "Olá, "+user.nome;
  document.getElementById('d-meta').innerText = user.meta;
  document.getElementById('d-total').innerText = 35;
  document.getElementById('d-du-rest').innerText = 10;
  document.getElementById('d-ritmo').innerText = "6/dia";
  document.getElementById('d-pct').innerText = "35%";
  document.getElementById('d-bar').style.width = "35%";
}

function addVenda(){
  alert("Venda registrada!");
}

function logout(){
  alert("Logout");
}

render();
</script>

</body>
</html>
