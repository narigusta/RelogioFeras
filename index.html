<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio de Vendas</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --text:#f0f0f5;
  --muted:#7a7a8c;
  --accent:#7c6af7;
  --accent2:#a898ff;
  --green:#3ecf8e;
  --red:#f56565;
  --amber:#f6ad55;
  --silver:#94a3b8;
  --gold:#f6ad55;
  --diamond:#a898ff;
  --ruby:#fc8181;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  max-width:100%;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* BACKGROUND */
body::before, body::after{
  content:'';
  position:fixed;
  pointer-events:none;
  z-index:0;
  max-width:100vw;
}
body::before{
  top:-40%;
  left:-20%;
  width:70%;
  height:70%;
  background:radial-gradient(circle,rgba(124,106,247,0.12),transparent 65%);
}
body::after{
  bottom:-30%;
  right:-10%;
  width:50%;
  height:50%;
  background:radial-gradient(circle,rgba(62,207,142,0.07),transparent 65%);
}

/* APP FULL */
.app{
  width:100%;
  padding:24px;
  position:relative;
  z-index:1;
}

/* SCREENS */
.screen{display:none;}
.screen.active{display:block;}

/* CARD */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  width:100%;
}

/* DASHBOARD GRID */
.dashboard-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
}

/* HEADER */
.dash-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* METRICS */
.metric-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.metric{
  background:var(--surface2);
  padding:16px;
  border-radius:14px;
}
.metric-label{
  font-size:11px;
  color:var(--muted);
}
.metric-value{
  font-size:24px;
  font-weight:700;
}

/* RESPONSIVO */
@media(max-width:900px){
  .dashboard-grid{
    grid-template-columns:1fr;
  }
  .metric-grid{
    grid-template-columns:1fr 1fr;
  }
}

/* BOTÕES */
.btn-primary{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.add-btn{
  width:100%;
  padding:16px;
  background:var(--accent);
  border:none;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<!-- DASHBOARD -->
<div id="s-dash" class="screen active">

<div class="card">

<div class="dash-header">
  <div>
    <div id="d-nome">Olá!</div>
    <div id="d-data"></div>
  </div>
  <button onclick="logout()">Sair</button>
</div>

<div class="dashboard-grid">

<!-- ESQUERDA -->
<div>

<div id="nivel-steps"></div>

<div id="d-level"></div>

<div id="d-streak"></div>

<div>
  <div id="d-xp-desc"></div>
  <div id="d-xp"></div>
</div>

</div>

<!-- DIREITA -->
<div>

<div class="metric-grid">

<div class="metric">
<div class="metric-label">Meta</div>
<div id="d-meta" class="metric-value"></div>
</div>

<div class="metric">
<div class="metric-label">Vendas</div>
<div id="d-total" class="metric-value"></div>
</div>

<div class="metric">
<div class="metric-label">Dias Rest.</div>
<div id="d-du-rest" class="metric-value"></div>
</div>

<div class="metric">
<div class="metric-label">Ritmo</div>
<div id="d-ritmo" class="metric-value"></div>
</div>

</div>

<div>
<div id="d-pct"></div>
<div id="d-bar"></div>
</div>

<div id="d-status"></div>

<div id="d-checkpoints"></div>

<button class="add-btn" onclick="addVenda()">+ Registrar venda</button>

</div>

</div>

</div>
</div>

</div>

<script>
/* TODO SEU JS ORIGINAL AQUI (SEM ALTERAR) */
</script>

</body>
</html>
